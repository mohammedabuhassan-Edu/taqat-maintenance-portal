name: Keep database awake

# Supabase pauses free-tier projects after a week without API traffic.
# A tiny authenticated read twice a week keeps it running.

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the REST API
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase variables not configured; skipping."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/announcements?select=id&limit=1")
          echo "HTTP $status"
          case "$status" in
            200|401|403) exit 0 ;;
            *) exit 1 ;;
          esac
